name: AI test case draft checks

on:
  pull_request:
    branches:
      - feature/test-data-parameterization
      - feature/stage4-test-management
      - feature/ai-test-case-drafts
      - integration/parameterization-integrity

jobs:
  ai-draft-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask Flask-SQLAlchemy Flask-Login Flask-WTF WTForms python-dotenv Markdown reportlab python-telegram-bot pytest pypdf cryptography
      - name: Compile Python files
        run: python -m compileall -q app tests
      - name: Run AI draft unit tests
        run: PYTHONPATH=. pytest -q tests/test_ai_test_case_generation.py
      - name: Run full regression suite
        run: PYTHONPATH=. pytest -q tests
