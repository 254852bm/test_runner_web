name: Admin panel static checks

on:
  pull_request:
    branches:
      - feature/stage4-test-management
  push:
    branches:
      - feature/admin-panel-v1

jobs:
  syntax-and-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install Flask Flask-SQLAlchemy Flask-Login Flask-WTF WTForms python-dotenv Markdown reportlab
      - name: Compile Python files
        run: python -m compileall -q app scripts
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          paths = [Path("templates/base.html"), *Path("templates/admin").glob("*.html")]
          for path in paths:
              env.parse(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY
