{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Мои проекты</h2>
    <a href="{{ url_for('main.create_project') }}" class="btn btn-primary">+ Создать проект</a>
</div>

{% if projects %}
    <div class="list-group">
        {% for project in projects %}
            <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="list-group-item list-group-item-action">
                {{ project.name }}
                <span class="badge bg-secondary float-end">{{ project.test_cases|length }} тестов</span>
            </a>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">У вас пока нет проектов. Создайте первый!</div>
{% endif %}
{% endblock %}
