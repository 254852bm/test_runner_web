{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-4">
    <h2 class="mb-0">Мои проекты</h2>
    <div class="action-buttons">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">← Назад к Dashboard</a>
        <a href="{{ url_for('main.create_project') }}" class="btn btn-primary">+ Создать проект</a>
    </div>
</div>

{% if projects %}
    <div class="list-group">
        {% for project in projects %}
            <div class="list-group-item d-flex justify-content-between align-items-start gap-3">
                <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="text-decoration-none flex-grow-1 project-name">
                    {{ project.name }}
                </a>
                <div class="action-buttons flex-shrink-0">
                    <span class="badge bg-secondary">{{ project.test_cases|length }} тестов</span>
                    <form method="POST" action="{{ url_for('main.delete_project', project_id=project.id) }}" class="d-inline"
                          onsubmit="return confirm('Удалить проект «{{ project.name|e }}» и все его тест-кейсы и результаты?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">У вас пока нет проектов. Создайте первый!</div>
{% endif %}
{% endblock %}
