{% extends "base.html" %}

{% block content %}
<div class="row g-4 documentation-layout">
    <div class="col-md-3">
        <div class="card documentation-nav">
            <div class="card-body">
                <h5 class="card-title mb-3">📚 Документация</h5>
                <div class="list-group">
                    <a href="{{ url_for('main.documentation', page='guide') }}"
                       class="list-group-item list-group-item-action {% if current_page == 'guide' %}active{% endif %}">
                        📘 Руководство пользователя
                    </a>
                    <a href="{{ url_for('main.documentation', page='faq') }}"
                       class="list-group-item list-group-item-action {% if current_page == 'faq' %}active{% endif %}">
                        ❓ Частые вопросы
                    </a>
                    <a href="{{ url_for('main.documentation', page='selenium') }}"
                       class="list-group-item list-group-item-action {% if current_page == 'selenium' %}active{% endif %}">
                        🤖 Автоматизация (Selenium)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-9">
        <article class="documentation-content">
            {{ content|safe }}
        </article>
    </div>
</div>
{% endblock %}
