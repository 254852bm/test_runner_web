{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Редактирование тест-кейса</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Заголовок</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ test.title }}" required>
            </div>
            <div class="mb-3">
                <label for="precondition" class="form-label">Предусловие</label>
                <textarea class="form-control" id="precondition" name="precondition" rows="2">{{ test.precondition or '' }}</textarea>
            </div>
            <div class="mb-3">
                <label for="steps" class="form-label">Шаги</label>
                <textarea class="form-control" id="steps" name="steps" rows="5" required>{{ test.steps }}</textarea>
            </div>
            <div class="mb-3">
                <label for="expected" class="form-label">Ожидаемый результат</label>
                <textarea class="form-control" id="expected" name="expected" rows="2">{{ test.expected_result or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-success">Сохранить изменения</button>
            <a href="{{ url_for('main.project_detail', project_id=project.id) }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
