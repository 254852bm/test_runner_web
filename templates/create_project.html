{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Создать новый проект</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Название проекта</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Например: Тестирование авторизации" required>
            </div>
            <button type="submit" class="btn btn-success">Создать</button>
            <a href="{{ url_for('main.projects') }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
